version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      tooling:
        patterns: ["typescript", "vitest"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
