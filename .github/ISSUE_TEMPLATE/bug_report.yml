# SPDX-License-Identifier: Apache-2.0
name: Bug report
description: Something does not behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here: see SECURITY.md.
        Do not paste secrets, cookies, account IDs or customer data.
  - type: input
    id: version
    attributes:
      label: Version
      description: Tag or commit.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Configuration (anonymised), requests, simulation parameters.
  - type: textarea
    id: metrics
    attributes:
      label: Metrics and logs
      description: Relevant wr_* metrics and decision logs (anonymised).
