# SPDX-License-Identifier: Apache-2.0
name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to achieve? Include traffic figures if relevant (anonymised).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: cost
    attributes:
      label: Impact on the budgets
      description: CPU per request, bundle size, Durable Object requests per month.
